<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 326" width="900" height="326" role="img" aria-label="delphi-p2p architecture: four peers (author, mirror, and two verifiers) exchange content-addressed files via iroh-blobs and signed claims via p2panda with no central server. Delphi.science and other sites are optional one-way viewers connected through a bridge.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M1 1.5L8.5 5L1 8.5" fill="none" stroke="#52596b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M1 1.5L8.5 5L1 8.5" fill="none" stroke="#1d54a6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Outer frame -->
  <rect x="6" y="6" width="888" height="314" rx="12" fill="#fbfbfd" stroke="#dde2ec" stroke-width="1.2"/>

  <!-- P2P Mesh Container -->
  <rect x="22" y="22" width="604" height="282" rx="10" fill="none" stroke="#70788b" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="38" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="0.06em" fill="#70788b">PEER-TO-PEER MESH</text>
  <text x="610" y="42" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" letter-spacing="0.04em" fill="#70788b">NO CENTRAL SERVER · NO ACCOUNT REQUIRED</text>

  <!-- Mesh diagonal links -->
  <line x1="256" y1="120" x2="392" y2="188" stroke="#dde2ec" stroke-width="1.4" stroke-dasharray="3.5 3"/>
  <line x1="256" y1="188" x2="392" y2="120" stroke="#dde2ec" stroke-width="1.4" stroke-dasharray="3.5 3"/>
  <rect x="260" y="141" width="128" height="26" rx="13" fill="#fbfbfd" stroke="#b8cff0" stroke-width="1.1"/>
  <text x="324" y="157.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.8" font-weight="600" fill="#1d54a6">files + signed claims</text>

  <!-- Orthogonal bidirectional peer edges -->
  <line x1="262" y1="94" x2="386" y2="94" stroke="#52596b" stroke-width="1.3" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="262" y1="214" x2="386" y2="214" stroke="#52596b" stroke-width="1.3" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="147" y1="138" x2="147" y2="170" stroke="#52596b" stroke-width="1.3" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="501" y1="138" x2="501" y2="170" stroke="#52596b" stroke-width="1.3" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- Peer A (author) -->
  <rect x="38" y="56" width="218" height="76" rx="8" fill="#f2f4f8" stroke="#dde2ec" stroke-width="1.3"/>
  <text x="52" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#141821">Peer A</text>
  <rect x="192" y="65" width="52" height="18" rx="9" fill="#fbfbfd" stroke="#dde2ec" stroke-width="1"/>
  <text x="218.0" y="77.4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#52596b">author</text>
  <text x="52" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.4" fill="#141821">publish ./proof</text>
  <text x="52" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.2" fill="#52596b">BLAKE3 <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" fill="#1d54a6">8f3a…</tspan></text>

  <!-- Peer B (verifier) -->
  <rect x="392" y="56" width="218" height="76" rx="8" fill="#f2f4f8" stroke="#dde2ec" stroke-width="1.3"/>
  <text x="406" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#141821">Peer B</text>
  <rect x="542" y="65" width="56" height="18" rx="9" fill="#eaf1fb" stroke="#b8cff0" stroke-width="1"/>
  <text x="570.0" y="77.4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#1d54a6">verifier</text>
  <text x="406" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.4" fill="#52596b">bwrap / Docker sandbox</text>
  <text x="406" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.2" fill="#52596b">lake check → <tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" fill="#1d54a6">pass ✓</tspan></text>

  <!-- Peer C (mirror) -->
  <rect x="38" y="176" width="218" height="76" rx="8" fill="#f2f4f8" stroke="#dde2ec" stroke-width="1.3"/>
  <text x="52" y="199" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#141821">Peer C</text>
  <rect x="192" y="185" width="52" height="18" rx="9" fill="#fbfbfd" stroke="#dde2ec" stroke-width="1"/>
  <text x="218.0" y="197.4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#52596b">mirror</text>
  <text x="52" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.4" fill="#141821">serve --mirror</text>
  <text x="52" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.2" fill="#52596b">holds &amp; serves <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#141821">8f3a…</tspan></text>

  <!-- Peer D (verifier) -->
  <rect x="392" y="176" width="218" height="76" rx="8" fill="#f2f4f8" stroke="#dde2ec" stroke-width="1.3"/>
  <text x="406" y="199" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#141821">Peer D</text>
  <rect x="542" y="185" width="56" height="18" rx="9" fill="#eaf1fb" stroke="#b8cff0" stroke-width="1"/>
  <text x="570.0" y="197.4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#1d54a6">verifier</text>
  <text x="406" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.4" fill="#52596b">sandboxed Lean 4.35+</text>
  <text x="406" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.2" fill="#52596b">lake comparator → <tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" fill="#1d54a6">pass ✓</tspan></text>

  <!-- Protocol foundation bar -->
  <rect x="38" y="266" width="278" height="24" rx="6" fill="#f2f4f8" stroke="#dde2ec" stroke-width="1"/>
  <text x="177" y="281.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.8" fill="#52596b"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" fill="#141821">iroh-blobs</tspan> · content-addressed files</text>
  <rect x="326" y="266" width="284" height="24" rx="6" fill="#f2f4f8" stroke="#dde2ec" stroke-width="1"/>
  <text x="468" y="281.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.8" fill="#52596b"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" fill="#141821">p2panda</tspan> · signed publish / have / check claims</text>

  <!-- Right column: Optional viewers -->
  <text x="698" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="0.06em" fill="#70788b">OPTIONAL VIEWERS</text>

  <!-- Bridge arrows -->
  <line x1="626" y1="94" x2="692" y2="94" stroke="#1d54a6" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr-acc)"/>
  <text x="659" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#52596b">bridge</text>
  <line x1="626" y1="214" x2="692" y2="214" stroke="#70788b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="659" y="205" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#52596b">bridge</text>

  <!-- Delphi.science viewer -->
  <rect x="698" y="56" width="180" height="76" rx="8" fill="#f2f4f8" stroke="#1d54a6" stroke-width="1.4"/>
  <text x="712" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#141821">Delphi.science</text>
  <text x="712" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.2" font-weight="600" fill="#1d54a6">Files &amp; checks</text>
  <text x="712" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.8" fill="#52596b">Mirrors diffs &amp; check counts</text>

  <!-- Any other site -->
  <rect x="698" y="176" width="180" height="76" rx="8" fill="#fbfbfd" stroke="#70788b" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="712" y="199" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#141821">Any other site</text>
  <text x="712" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.2" fill="#52596b">One-way viewer</text>
  <text x="712" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.8" fill="#70788b">Self-hosted or static mirror</text>

  <text x="788" y="281.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.6" fill="#70788b">Files stay on the peer mesh</text>
</svg>
